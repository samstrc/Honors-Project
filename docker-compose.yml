# The whole site in four containers. Only `web` is published; the rest talk to each
# other over the compose network by service name.
#
#   docker compose up --build        then open http://localhost:8080
#
# The chatbot needs OPENAI_API_KEY. It is read from Modeling/.env, the same file the
# project already keeps it in. (env_file passes that file's variables into the
# guide-service container only.)

services:
  model-api:
    build:
      context: .
      dockerfile: docker/model-api.Dockerfile
    restart: unless-stopped

  guide-service:
    build:
      context: .
      dockerfile: docker/guide-service.Dockerfile
    env_file:
      - path: Modeling/.env
        required: false
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      - PORT=8787
      - PREAPPROVAL_API_URL=http://model-api:8000
      - GUIDE_API_URL=http://guide-service:8001
    depends_on:
      - model-api
      - guide-service
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
