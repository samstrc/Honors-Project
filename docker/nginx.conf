server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # the Express backend; the service name resolves inside the compose network
    location /api/ {
        proxy_pass http://backend:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # /api/chat/stream is server-sent events: hand chunks straight through
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    # hashed build assets can be cached hard
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # the shell itself must be re-checked every load, or a rebuild's new asset hashes
    # would be invisible to returning visitors until their cache expired
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # client-side routing: any other path is the app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
